version: 2

models:
  - name: stg_postgres__aircrafts
    description: Самолеты
    columns: 
      - name: aircraft_code
        description: Код самолета IATA
        tests:
          - unique
          - not_null
      - name: model
        description: Модель самолета
      - name: range
        description: Максимальная длительность поета
      - name: created_at
        description: Метка создания записи
  - name: stg_postgres__airports
    description: Аэропорты
    columns:
      - name: airport_code
        description: Код аэропорта
        tests:
          - unique
          - not_null
      - name: airport_name
        description: Название аэропорта
      - name: city
        description: Город
      - name: longitude
        description: Координаты аэропорта долгота
      - name: latitude
        description: Координаты аэропорта широта
      - name: timezone
        description: Временная зона аэропорта
      - name: created_at
        description: Метка создания записи
  - name: stg_postgres__boarding_passes
    description: Посадочные талоны
    columns:
      - name: ticket_no
        description: Номер билета
        tests:
          - not_null
      - name: flight_id
        description: Идентификатор рейса
        tests:
          - not_null
      - name: boarding_no
        description: Номер посадочного талона
      - name: seat_no
        description: Номер места
      - name: created_at
        description: Метка создания записи
  - name: stg_postgres__bookings
    description: Бронирования
    columns:
      - name: book_ref
        description: Номер бронирования
        tests:
          - unique
          - not_null
      - name: booked_at
        description: Дата бронирования
      - name: total_amount
        description: Полная сумма бронирования
      - name: created_at
        description: Метка создания записи
  - name: stg_postgres__flights
    description: Полеты
    columns:
      - name: flight_id
        description: Идентификатор рейса
        tests:
          - not_null
      - name: flight_no
        description: Номер рейса
        tests:
          - not_null
      - name: aircraft_code
        description: Код самолета, IATA
      - name: departure_airport
        description: Аэропорт отправления
      - name: arrival_airport
        description: Аэропорт прибытия
      - name: scheduled_departure_at
        description: Время вылета по расписанию
      - name: scheduled_arrival_at
        description: Время прилёта по расписанию
      - name: status
        description: Статус рейса
      - name: actual_departured_at
        description: Фактическое время вылета
      - name: actual_arrivaled_at
        description: Фактическое время прилёта
      - name: created_at
        description: Метка создания записи
  - name: stg_postgres__seats
    description: Места
    columns:
      - name: aircraft_code
        description: Код самолета, IATA
        tests:
          - not_null
      - name: seat_no
        tests:
          - not_null
        description: Номер места
      - name: fare_conditions
        description: Класс обслуживания
      - name: created_at
        description: Метка создания записи
  - name: stg_postgres__ticket_flights
    description: Перелеты
    columns:
      - name: ticket_no
        description: Номер билета
        tests:
          - not_null
      - name: flight_id
        description: Идентификатор рейса
        tests:
          - not_null
      - name: fare_conditions
        description: Класс обслуживания
      - name: amount
        description: Стоимость перелета
      - name: created_at
        description: Метка создания записи
  - name: stg_postgres__tickets
    description: Билеты
    columns:
      - name: ticket_no
        description: Номер билета
        tests:
          - unique
          - not_null
      - name: book_ref
        description: Номер бронирования
        tests:
          - not_null
      - name: passenger_id
        tests:
          - not_null
        description: Идентификатор пассажира
      - name: passenger_name
        description: Имя пассажира
      - name: contact_data
        description: Контактные данные пассажира
      - name: phone
        description: Телефон пассажира
      - name: email
        description: Почта пассажира
      - name: created_at
        description: Метка создания записи