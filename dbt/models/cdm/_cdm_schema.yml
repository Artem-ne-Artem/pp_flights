version: 2

models:
  - name: flights
    description: Основная витрина с информацией о рейсах, билетах и бронированиях
    columns:
      - name: book_id
        description: Неуникальный идентификатор бронирования
      - name: booked_at
        description: Дата и время бронирования
      - name: book_amount
        description: Сумма бронирования в валюте
      - name: passenger_id
        description: Неуникальный идентификатор пассажира
      - name: ticket_id
        description: Неуникальный номер билета
      - name: fare_conditions
        description: Класс обслуживания
      - name: flight_amount
        description: Стоимость перелета
      - name: boarding_no
        description: Идентификатор посадки, неуникальный
      - name: flight_id
        description: Хэш номера рейса и запланированного времени вылета, неуникальный идентификатор
      - name: flight_number
        description: Номер рейса, повторяется каждые несколько дней, неуникальный
      - name: book_business_seats_per_flight_cnt
        description: Количество забронированных мест бизнес-класса на рейсе
      - name: book_seats_per_flight_cnt
        description: Общее количество забронированных мест на рейсе
      - name: scheduled_departure_at
        description: Время вылета по расписанию
      - name: scheduled_arrival_at
        description: Время прибытия по расписанию
      - name: scheduled_duration
        description: Продолжительность рейса по расписанию, в часах
      - name: status
        description: Статус рейса
      - name: actual_departured_at
        description: Фактическое время вылета
      - name: actual_arrivaled_at
        description: Фактическое время прибытия
      - name: departure_airport
        description: Аэропорт отправления
      - name: departure_city
        description: Город вылета
      - name: arrival_airport
        description: Аэропорт прибытия
      - name: arrival_city
        description: Город прибытия
      - name: aircraft_code
        description: Код самолета, IATA
      - name: aircraft_model
        description: Модель самолета
      - name: seats_cnt
        description: Общее количество мест в самолёте
      - name: seats_business_cnt
        description: Количество мест бизнес-класса в самолёте
      - name: range
        description: Максимальная дальность полёта самолёта